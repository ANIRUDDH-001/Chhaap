name: chhaap
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: chhaap_admin
      POSTGRES_DB: chhaap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/01-chhaap.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U chhaap_admin -d chhaap']
      interval: 5s
      retries: 12
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: &backend-env
      DATABASE_ADMIN_URL: postgresql+psycopg://chhaap_admin:${POSTGRES_PASSWORD}@db:5432/chhaap
      DATABASE_URL: postgresql+psycopg://chhaap_app:${APP_DB_PASSWORD}@db:5432/chhaap
      FRONTEND_ORIGIN: http://localhost:5175
      OLLAMA_URL: http://host.docker.internal:11435
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      DATA_DIR: /data/media
    command: [python, -m, chhaap.migrate]
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *backend-env
    volumes: [media:/data]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *backend-env
    volumes: [media:/data]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
    command: [python, -m, chhaap.worker]
  retention:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *backend-env
    volumes: [media:/data]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
    command: [python, -m, chhaap.retention, --loop]
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    ports: ['127.0.0.1:5175:80']
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres:
  media:
