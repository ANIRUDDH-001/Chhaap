name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chhaap_admin
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: chhaap_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U chhaap_admin -d chhaap_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_ADMIN_URL: postgresql+psycopg://chhaap_admin:ci-admin-only@localhost:5432/chhaap_test
      TEST_DATABASE_URL: postgresql+psycopg://chhaap_app:ci-app-only@localhost:5432/chhaap_test
      DATABASE_URL: postgresql+psycopg://chhaap_app:ci-app-only@localhost:5432/chhaap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - name: Create restricted application role
        env: {PGPASSWORD: ci-admin-only}
        run: psql -h localhost -U chhaap_admin -d chhaap_test -c "CREATE ROLE chhaap_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
      - run: python -m ruff check backend
      - run: python -m pytest backend/tests -q
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
